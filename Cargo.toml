[package]
name = "jegrep"
version = "0.1.1"
edition = "2024"
description = "Semantic grep: find code by describing what you're looking for, powered by Jev."
license = "MIT"
repository = "https://github.com/can1357/jegrep"
documentation = "https://github.com/can1357/jegrep/blob/main/README.md"
keywords = ["search", "grep", "semantic", "code", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.2", features = ["json"] }
globset = "0.4"
parking_lot = "0.12.5"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
rayon = "1.12"
terminal_size = "0.4"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[lints.rust]
mismatched_lifetime_syntaxes = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }

disallowed_methods = "deny"
disallowed_types = "deny"

allow_attributes_without_reason = "warn"

borrow_as_ptr = "allow"
cast_ptr_alignment = "allow"
ptr_as_ptr = "allow"
ref_as_ptr = "allow"
undocumented_unsafe_blocks = "warn"
unsafe_derive_deserialize = "allow"

cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
tuple_array_conversions = "allow"

float_cmp = "allow"

inline_always = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
redundant_closure_for_method_calls = "allow"
return_self_not_must_use = "allow"

inconsistent_struct_constructor = "allow"
missing_fields_in_debug = "allow"
struct_excessive_bools = "allow"

match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
option_if_let_else = "allow"

enum_glob_use = "allow"
items_after_statements = "allow"
wildcard_imports = "allow"

let_underscore_untyped = "allow"
similar_names = "allow"

tabs_in_doc_comments = "allow"
unreadable_literal = "allow"
verbose_bit_mask = "allow"

assert_is_empty = "allow"
default_trait_access = "allow"
significant_drop_tightening = "allow"

missing_errors_doc = "allow"
missing_panics_doc = "allow"

too_many_arguments = "allow"
too_many_lines = "allow"

[profile.dev]
debug = false
split-debuginfo = "off"
incremental = false
codegen-units = 256

[profile.release]
opt-level = 2
debug = false
incremental = true
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[profile.release-dev]
inherits = "release"
codegen-units = 16

[profile.release-profiling]
inherits = "release"
debug = "line-tables-only"
split-debuginfo = "unpacked"
strip = "none"
